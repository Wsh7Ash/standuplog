[build-system]
requires=["setuptools>=61.0"]
build-backend="setuptools.build_meta"
[project]
name="standuplog"
version="0.1.0"
description="Standup digest generator from git history"
readme="README.md"
requires-python=">=3.10"
dependencies=["click>=8.1.0","rich>=13.0.0"]
[project.scripts]
standuplog="standuplog.cli:main"
[tool.setuptools.packages.find]
where=["src"]
